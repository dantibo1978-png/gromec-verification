<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotation Transport — GLS Canada</title>
<style>
:root{--bg:#f5f4f0;--sur:#fff;--brd:#e2e0d8;--txt:#1a1a18;--mut:#6b6b64;--acc:#1a3a5c;--acl:#e8eef5;--ok:#1a6b3a;--okb:#e8f5ee;--er:#8b1a1a;--erb:#fdeaea;--wa:#7a4a00;--wab:#fff3dc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:var(--acc);color:#fff;padding:1rem 2rem;display:flex;align-items:baseline;gap:1rem}
header h1{font-size:1.1rem;font-weight:normal}
header span{font-size:.7rem;opacity:.5;font-family:monospace}
.layout{max-width:900px;margin:0 auto;padding:1.25rem 2rem;display:flex;flex-direction:column;gap:1.25rem}
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:6px;overflow:hidden}
.phd{background:var(--acc);color:#fff;padding:.5rem 1rem;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
.phd .tag{background:rgba(255,255,255,.2);padding:2px 7px;border-radius:3px;font-size:.66rem}
.pbd{padding:.9rem}
label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:.25rem;font-weight:bold;letter-spacing:.03em}
input,select{width:100%;border:1px solid var(--brd);border-radius:4px;padding:.5rem .65rem;font-size:.82rem;font-family:Georgia,serif;background:var(--bg);color:var(--txt)}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.full{margin-bottom:.8rem}
.btn{background:var(--acc);color:#fff;border:none;padding:.6rem 1.5rem;border-radius:4px;font-size:.85rem;cursor:pointer;transition:opacity .15s;font-family:Georgia,serif}
.btn:hover{opacity:.85}.btn:disabled{opacity:.32;cursor:not-allowed}
.btn-s{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:.45rem 1rem;font-size:.78rem}
.help{font-size:.68rem;color:var(--mut);margin-top:.2rem}
.sb{padding:.5rem .8rem;font-size:.78rem;border-radius:4px;margin-top:.6rem;font-family:monospace;white-space:pre-wrap;word-break:break-all;display:none}
.sb.i{background:var(--acl);color:var(--acc);display:block}
.sb.o{background:var(--okb);color:var(--ok);display:block}
.sb.e{background:var(--erb);color:var(--er);display:block}

.pkg-row{display:grid;grid-template-columns:3fr 2fr 2fr 2fr auto;gap:.5rem;align-items:end;margin-bottom:.5rem}
.pkg-row input{font-size:.78rem;padding:.4rem .5rem}
.pkg-row button{background:var(--er);color:#fff;border:none;border-radius:4px;padding:.35rem .6rem;font-size:.75rem;cursor:pointer;height:fit-content}
.pkg-row button:hover{opacity:.8}

.result-card{background:var(--okb);border:1px solid var(--ok);border-radius:6px;padding:1rem;margin-top:.6rem}
.result-card h3{color:var(--ok);font-size:.9rem;margin-bottom:.5rem}
.result-line{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid rgba(26,107,58,.15);font-size:.82rem}
.result-line:last-child{border-bottom:none;font-weight:bold;font-size:.9rem;padding-top:.5rem}
.result-line .lbl{color:var(--mut)}

.error-card{background:var(--erb);border:1px solid var(--er);border-radius:6px;padding:1rem;margin-top:.6rem}
.error-card h3{color:var(--er);font-size:.9rem;margin-bottom:.3rem}
.error-card p{font-size:.8rem;color:var(--er)}

#log-panel{display:none}
#log-panel.show{display:block}
#log{font-family:'Courier New',monospace;font-size:.7rem;background:var(--bg);border:1px solid var(--brd);border-radius:4px;padding:.6rem;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--sur);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:500px;width:90%;max-height:85vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{background:var(--acc);color:#fff;padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0}
.m-route{text-align:center;padding-bottom:.8rem;border-bottom:1px solid var(--brd);margin-bottom:.8rem;font-size:.9rem;color:var(--acc)}
.m-line{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--brd);font-size:.84rem}
.m-line .lbl{color:var(--mut)}
.m-sep{border-top:1px solid var(--brd);margin:.5rem 0;padding-top:.4rem;font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.m-total{text-align:center;padding:1rem 0 .5rem;border-top:2px solid var(--ok);margin-top:.8rem}
.m-total .price{font-size:2.2rem;font-weight:bold;color:var(--ok)}
.m-total .lbl{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.modal-header h3{font-size:.9rem;font-weight:normal}
.modal-close{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:0 .3rem;opacity:.7}
.modal-close:hover{opacity:1}
.modal-body{padding:1.2rem}
.modal .result-card{margin-top:0;border:none;padding:0;background:transparent}
.modal .result-card h3{display:none}
.modal-total{text-align:center;padding:1rem 0 .5rem;border-top:2px solid var(--ok);margin-top:.8rem}
.modal-total .price{font-size:2rem;font-weight:bold;color:var(--ok)}
.modal-total .price-label{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.modal-route{text-align:center;padding-bottom:.8rem;border-bottom:1px solid var(--brd);margin-bottom:.8rem;font-size:.85rem;color:var(--acc)}
</style>
</head>
<body>

<header>
  <h1>Cotation Transport — GLS Canada</h1>
  <span>v1.0</span>
</header>

<div class="layout">

  <!-- CONFIG -->
  <div class="panel">
    <div class="phd">Configuration API <span class="tag">requis</span></div>
    <div class="pbd">
      <div class="row">
        <div>
          <label>Environnement GLS</label>
          <select id="env">
            <option value="https://sandbox-smart4i.gls-canada.com">Sandbox (test)</option>
            <option value="https://smart4i.gls-canada.com">Production</option>
          </select>
          <div class="help">Le proxy CORS est intégré — aucune configuration requise.</div>
        </div>
        <div>
          <label>Catégorie d'envoi</label>
          <select id="category">
            <option value="Parcel">Colis (Parcel)</option>
            <option value="Freight">Fret (Freight)</option>
          </select>
        </div>
      </div>
      <div class="row3">
        <div>
          <label>Type de paiement</label>
          <select id="payment-type">
            <option value="Prepaid">Prépayé (Prepaid)</option>
            <option value="ThirdParty">Tiers (Third Party)</option>
            <option value="Collect">À percevoir (Collect)</option>
          </select>
        </div>
        <div>
          <label>Type de livraison</label>
          <select id="delivery-type">
            <option value="GRD">Terrestre (Ground)</option>
            <option value="EXP">Express</option>
            <option value="PRI">Prioritaire</option>
          </select>
        </div>
        <div>
          <label>Unité de mesure</label>
          <select id="unit">
            <option value="L">Impérial (lb / po)</option>
            <option value="K">Métrique (kg / cm)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Numéro de compte (billing)</label>
          <input type="text" id="billing" placeholder="Votre # de compte GLS">
        </div>
        <div>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Nom d'utilisateur API</label>
          <input type="text" id="api-user" placeholder="votre_utilisateur">
        </div>

          <label>Mot de passe API</label>

        </div>

        <button class="btn-s btn" onclick="saveConfig()" style="font-size:.75rem">Sauvegarder dans le navigateur</button>

      </div>
    </div>
  </div>

  <!-- EXPÉDITEUR / DESTINATAIRE -->

    <div class="phd">Adresses</div>
    <div class="pbd">
      <div class="row">
        <div>

          <div class="full">

                <option value="G1E 1A1|QC|Beauport">Beauport — G1E 1A1</option>
                <option value="J3T 1A1|QC|Saint-Hubert">Saint-Hubert — J3T 1A1</option>
                <option value="G7K 1C3|QC|Chicoutimi">Chicoutimi — G7K 1C3</option>
                <option value="G5C 1A1|QC|Baie-Comeau">Baie-Comeau — G5C 1A1</option>
                <option value="G8P 1A1|QC|Chibougamau">Chibougamau — G8P 1A1</option>
                <option value="J9P 1A1|QC|Val-d'Or">Val-d'Or — J9P 1A1</option>
                <option value="J6E 1A1|QC|Saint-Jérôme">Saint-Jérôme — J6E 1A1</option>
                <option value="G5R 1A1|QC|Rimouski">Rimouski — G5R 1A1</option>
              </optgroup>
              <optgroup label="Ontario">
                <option value="M5V 2T6|ON|Toronto">Toronto — M5V 2T6</option>
                <option value="K1A 0A6|ON|Ottawa">Ottawa — K1A 0A6</option>
                <option value="L5B 1E4|ON|Mississauga">Mississauga — L5B 1E4</option>
                <option value="L8P 1A1|ON|Hamilton">Hamilton — L8P 1A1</option>
                <option value="N6A 1A1|ON|London">London — N6A 1A1</option>
                <option value="L4B 1A1|ON|Markham">Markham — L4B 1A1</option>
                <option value="L6Y 1A1|ON|Brampton">Brampton — L6Y 1A1</option>
                <option value="N2G 1A1|ON|Kitchener">Kitchener — N2G 1A1</option>
                <option value="L3R 1A1|ON|Scarborough">Scarborough — L3R 1A1</option>
                <option value="P3E 1A1|ON|Sudbury">Sudbury — P3E 1A1</option>
                <option value="N1H 1A1|ON|Guelph">Guelph — N1H 1A1</option>
                <option value="P7A 1A1|ON|Thunder Bay">Thunder Bay — P7A 1A1</option>
                <option value="N2L 1A1|ON|Waterloo">Waterloo — N2L 1A1</option>
              </optgroup>
            </select>
          </div>
          <div class="full">
            <label>Code postal</label>
            <input type="text" id="from-postal" placeholder="H2X 1Y4" maxlength="7">
          </div>
          <div class="full">
            <label>Province</label>
            <select id="from-prov">
              <option value="QC">Québec</option>
              <option value="ON">Ontario</option>
              <option value="AB">Alberta</option>
              <option value="BC">Colombie-Britannique</option>
              <option value="MB">Manitoba</option>
              <option value="SK">Saskatchewan</option>
              <option value="NS">Nouvelle-Écosse</option>
              <option value="NB">Nouveau-Brunswick</option>
              <option value="NL">Terre-Neuve</option>
              <option value="PE">Île-du-Prince-Édouard</option>
              <option value="NT">Territoires du Nord-Ouest</option>
              <option value="NU">Nunavut</option>
              <option value="YT">Yukon</option>
            </select>
          </div>
          <div class="full">
            <label>Ville</label>
            <input type="text" id="from-city" placeholder="Montréal">
          </div>
        </div>
        <div>
          <h4 style="font-size:.82rem;margin-bottom:.6rem;color:var(--acc)">Destinataire</h4>
          <div class="full">
            <label>Ville rapide</label>
            <select id="to-quick" onchange="fillAddr('to')">
              <option value="">— Choisir ou taper manuellement —</option>
              <optgroup label="Québec">
                <option value="H2X 1Y4|QC|Montréal">Montréal — H2X 1Y4</option>
                <option value="G1R 1A1|QC|Québec">Québec — G1R 1A1</option>
                <option value="J6W 1A1|QC|Laval">Laval — J6W 1A1</option>
                <option value="J4G 1A1|QC|Longueuil">Longueuil — J4G 1A1</option>
                <option value="J8Y 1A1|QC|Gatineau">Gatineau — J8Y 1A1</option>
                <option value="J1H 1A1|QC|Sherbrooke">Sherbrooke — J1H 1A1</option>
                <option value="J2S 1A1|QC|Drummondville">Drummondville — J2S 1A1</option>
                <option value="G1E 1A1|QC|Beauport">Beauport — G1E 1A1</option>
                <option value="J3T 1A1|QC|Saint-Hubert">Saint-Hubert — J3T 1A1</option>
                <option value="G7K 1C3|QC|Chicoutimi">Chicoutimi — G7K 1C3</option>
                <option value="G5C 1A1|QC|Baie-Comeau">Baie-Comeau — G5C 1A1</option>
                <option value="G8P 1A1|QC|Chibougamau">Chibougamau — G8P 1A1</option>
                <option value="J9P 1A1|QC|Val-d'Or">Val-d'Or — J9P 1A1</option>
                <option value="J6E 1A1|QC|Saint-Jérôme">Saint-Jérôme — J6E 1A1</option>
                <option value="G5R 1A1|QC|Rimouski">Rimouski — G5R 1A1</option>
              </optgroup>
              <optgroup label="Ontario">
                <option value="M5V 2T6|ON|Toronto">Toronto — M5V 2T6</option>
                <option value="K1A 0A6|ON|Ottawa">Ottawa — K1A 0A6</option>
                <option value="L5B 1E4|ON|Mississauga">Mississauga — L5B 1E4</option>
                <option value="L8P 1A1|ON|Hamilton">Hamilton — L8P 1A1</option>
                <option value="N6A 1A1|ON|London">London — N6A 1A1</option>
                <option value="L4B 1A1|ON|Markham">Markham — L4B 1A1</option>
                <option value="L6Y 1A1|ON|Brampton">Brampton — L6Y 1A1</option>
                <option value="N2G 1A1|ON|Kitchener">Kitchener — N2G 1A1</option>
                <option value="L3R 1A1|ON|Scarborough">Scarborough — L3R 1A1</option>
                <option value="P3E 1A1|ON|Sudbury">Sudbury — P3E 1A1</option>
                <option value="N1H 1A1|ON|Guelph">Guelph — N1H 1A1</option>
                <option value="P7A 1A1|ON|Thunder Bay">Thunder Bay — P7A 1A1</option>
                <option value="N2L 1A1|ON|Waterloo">Waterloo — N2L 1A1</option>
              </optgroup>
            </select>
          </div>

            <input type="text" id="to-postal" placeholder="M5V 2T6" maxlength="7">
          </div>

            <label>Province</label>
            <select id="to-prov">
              <option value="ON">Ontario</option>
              <option value="QC">Québec</option>
              <option value="AB">Alberta</option>
              <option value="BC">Colombie-Britannique</option>
              <option value="MB">Manitoba</option>

              <option value="NL">Terre-Neuve</option>

  <!-- COLIS -->
  <div class="panel">
    <div class="phd">Colis <span class="tag" id="pkg-count">1 colis</span></div>
    <div class="pbd">
      <div style="margin-bottom:.4rem">
        <div class="pkg-row" style="font-size:.68rem;color:var(--mut);font-weight:bold">
          <span>Description</span>
          <span>Poids (lb)</span>
          <span>Longueur × Largeur × Hauteur (po)</span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div id="pkg-list"></div>
      <button class="btn-s btn" onclick="addPkg()" style="margin-top:.3rem;font-size:.75rem">+ Ajouter un colis</button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
    <button class="btn" id="btn-go" onclick="getRate()">Obtenir le tarif</button>
    <button class="btn btn-s" onclick="clearAll()">Effacer</button>
    <label style="font-size:.75rem;color:var(--mut);display:flex;align-items:center;gap:.3rem;cursor:pointer;margin-bottom:0">
      <input type="checkbox" id="dbg" onchange="toggleLog()"> Afficher le journal

  <div class="panel" id="log-panel">
    <div class="phd">Journal</div>
    <div class="pbd">
      <div id="log"></div>

</div>

<script>
var pkgId = 0;

function el(id) { return document.getElementById(id); }

function log(msg) {
  var d = el('log');
  var ts = new Date().toLocaleTimeString('fr-CA');
  d.textContent += '[' + ts + '] ' + msg + '\n';
  d.scrollTop = d.scrollHeight;
}

function toggleLog() {
  el('log-panel').classList.toggle('show', el('dbg').checked);
}

// ── VILLE RAPIDE ──
function fillAddr(prefix) {
  var val = el(prefix + '-quick').value;
  if (!val) return;
  var parts = val.split('|');
  el(prefix + '-postal').value = parts[0];
  el(prefix + '-prov').value = parts[1];
  el(prefix + '-city').value = parts[2];
}

// ── CONFIG PERSISTANCE ──
function saveConfig() {
  var cfg = {
    billing: el('billing').value.trim(),
    env: el('env').value,
    user: el('api-user').value.trim(),
    pass: el('api-pass').value.trim(),
    fromPostal: el('from-postal').value.trim(),
    fromProv: el('from-prov').value,
    fromCity: el('from-city').value.trim()
  };
  localStorage.setItem('gls-config', JSON.stringify(cfg));
  el('save-note').textContent = 'Sauvegardé';
  setTimeout(function() { el('save-note').textContent = ''; }, 2000);
}

function loadConfig() {
  try {
    var cfg = JSON.parse(localStorage.getItem('gls-config'));
    if (!cfg) return;
    if (cfg.billing) el('billing').value = cfg.billing;
    if (cfg.env)   el('env').value = cfg.env;
    if (cfg.user)  el('api-user').value = cfg.user;
    if (cfg.pass)  el('api-pass').value = cfg.pass;
    if (cfg.fromPostal) el('from-postal').value = cfg.fromPostal;
    if (cfg.fromProv)   el('from-prov').value = cfg.fromProv;
    if (cfg.fromCity)   el('from-city').value = cfg.fromCity;
  } catch (e) {}
}

// ── COLIS ──
function addPkg(desc, weight, l, w, h) {
  pkgId++;
  var id = pkgId;
  var div = document.createElement('div');
  div.className = 'pkg-row';
  div.id = 'pkg-' + id;
  div.innerHTML =
    '<input type="text" placeholder="Colis ' + id + '" value="' + (desc || '') + '">' +
    '<input type="number" placeholder="0" min="0" step="0.1" value="' + (weight || '') + '">' +
    '<input type="text" placeholder="L × W × H" value="' + (l && w && h ? l + ' × ' + w + ' × ' + h : '') + '">' +
    '<span></span>' +
    '<button onclick="removePkg(' + id + ')">✕</button>';
  el('pkg-list').appendChild(div);
  updatePkgCount();
}

function removePkg(id) {
  var row = el('pkg-' + id);
  if (row) row.remove();
  updatePkgCount();
  if (el('pkg-list').children.length === 0) addPkg();
}

function updatePkgCount() {
  var n = el('pkg-list').children.length;
  el('pkg-count').textContent = n + ' colis';
}

function getPkgs() {
  var rows = el('pkg-list').children;
  var pkgs = [];
  for (var i = 0; i < rows.length; i++) {
    var inputs = rows[i].querySelectorAll('input');
    var dims = (inputs[2].value || '').replace(/\s/g, '').split(/[×xX,]/);
    pkgs.push({
      description: inputs[0].value || 'Colis ' + (i + 1),
      weight: parseFloat(inputs[1].value) || 1,
      length: parseFloat(dims[0]) || 12,
      width: parseFloat(dims[1]) || 12,
      height: parseFloat(dims[2]) || 12
    });
  }
  return pkgs;
}

// ── API CALL ──
function getRate() {
  var proxy = '/api/gls-rate';
  var target = el('env').value;
  var user = el('api-user').value.trim();
  var pass = el('api-pass').value.trim();

  if (!user || !pass) { showError('Identifiants API manquants.'); return; }

  var fromPostal = el('from-postal').value.trim().replace(/\s/g, '').toUpperCase();
  var toPostal = el('to-postal').value.trim().replace(/\s/g, '').toUpperCase();
  if (!fromPostal || !toPostal) { showError('Codes postaux requis.'); return; }

  var pkgs = getPkgs();
  if (pkgs.length === 0) { showError('Ajoutez au moins un colis.'); return; }

  var billing = el('billing').value.trim();

  var body = {
    category: el('category').value,
    paymentType: el('payment-type').value,
    deliveryType: el('delivery-type').value,
    unitOfMeasurement: el('unit').value,
    sender: {
      name: 'Sender',
      customerName: 'Sender',
      addressLine1: '',
      city: el('from-city').value.trim() || '',
      province: el('from-prov').value,
      provinceCode: el('from-prov').value,
      postalCode: fromPostal,
      country: 'CA',
      countryCode: 'CA',
      contact: { fullName: 'Sender', telephone: '0000000000' }
    },
    consignee: {
      name: 'Consignee',
      customerName: 'Consignee',
      addressLine1: '',
      city: el('to-city').value.trim() || '',
      province: el('to-prov').value,
      provinceCode: el('to-prov').value,
      postalCode: toPostal,
      country: 'CA',
      countryCode: 'CA',
      contact: { fullName: 'Consignee', telephone: '0000000000' }
    },
    parcels: pkgs.map(function(p) {
      return {
        parcelType: 'Box',
        quantity: 1,
        description: p.description,
        weight: p.weight,
        declaredWeight: p.weight,
        length: p.length,
        width: p.width,
        height: p.height,
        depth: p.height
      };
    })
  };
  if (billing) body.billing = billing;

  var btn = el('btn-go');
  btn.disabled = true;
  btn.textContent = 'Chargement…';
  el('result').innerHTML = '';
  log('Envoi vers ' + proxy);
  log('Cible: ' + target);
  log('Corps: ' + JSON.stringify(body, null, 2));

  var auth = 'Basic ' + btoa(user + ':' + pass);

  fetch(proxy, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json',
      'Authorization': auth,
      'X-Gls-Target': target
    },
    body: JSON.stringify(body)
  })
  .then(function(r) {
    log('Statut HTTP: ' + r.status);
    return r.text().then(function(txt) {
      log('Réponse brute: ' + txt);
      if (!r.ok) {
        var msg = 'Erreur HTTP ' + r.status;
        try { var j = JSON.parse(txt); msg += ' — ' + (j.message || j.error || txt); } catch(e) { msg += ' — ' + txt; }
        throw new Error(msg);
      }
      try { return JSON.parse(txt); } catch(e) { throw new Error('Réponse non-JSON: ' + txt.substring(0, 200)); }
    });
  })
  .then(function(data) {
    log('Données parsées: ' + JSON.stringify(data, null, 2));
    showResult(data);
  })
  .catch(function(err) {
    log('ERREUR: ' + err.message);
    if (err.message.indexOf('Failed to fetch') >= 0 || err.message.indexOf('NetworkError') >= 0) {
      showError('Impossible de joindre le proxy. Vérifiez que le Worker est déployé et que l\'URL est correcte.');
    } else if (err.message.indexOf('401') >= 0) {
      showError('Authentification refusée (401). Le tunnel fonctionne, mais les identifiants sont incorrects.');
    } else if (err.message.indexOf('403') >= 0) {
      showError('Accès interdit (403). Le tunnel fonctionne, mais la permission « Rate View » manque sur votre compte GLS.');
    } else {
      showError(err.message);
    }
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = 'Obtenir le tarif';
  });
}

var ACCOUNT_LABELS = { NEG: 'Tarif négocié', GEN: 'Tarif général', VOL: 'Tarif volume' };
var RATE_LABELS = { GRD: 'Terrestre', EXP: 'Express', PRI: 'Prioritaire' };
var CHARGE_LABELS = {
  basicCharge: 'Tarif de base', weightCharge: 'Supplément poids',
  zoneCharge: 'Supplément zone', otherCharge: 'Autres frais',
  cubicWeight: 'Poids volumétrique', subTotal: 'Sous-total'
};
var SURCHARGE_LABELS = {
  'Fuel surcharge': 'Supplément carburant', 'Residential delivery': 'Livraison résidentielle',
  'QFA': 'QFA (ajustement qualité)', 'Beyond area': 'Zone éloignée'
};

function showResult(data) {
  var list = Array.isArray(data) ? data : null;
  if (!list) {
    for (var k in data) { if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === 'object') { list = data[k]; break; } }
  }
  if (!list) list = [data];

  var neg = list.filter(function(s) { return s.accountType === 'NEG'; });
  if (neg.length) list = neg;

  var svc = list[0];
  var total = svc.totalCharge || svc.total || svc.totalCharges || 0;
  var transit = svc.transitDays || svc.estimatedDeliveryDays || '';
  var fromCity = el('from-city').value || el('from-postal').value;
  var toCity = el('to-city').value || el('to-postal').value;

  var html = '';
  html += '<div class="m-route">' + escHtml(fromCity) + ' &rarr; ' + escHtml(toCity);
  if (transit) html += ' &nbsp;(' + transit + ' jour(s))';
  html += '</div>';

  if (svc.basicCharge) html += line('Tarif de base', svc.basicCharge);
  if (svc.weightCharge) html += line('Supplément poids', svc.weightCharge);
  if (svc.zoneCharge) html += line('Supplément zone', svc.zoneCharge);
  if (svc.otherCharge) html += line('Autres frais', svc.otherCharge);
  if (svc.subTotal) html += line('Sous-total', svc.subTotal, true);

  var surcharges = svc.surcharges || svc.accessorials || svc.charges || [];
  if (Array.isArray(surcharges) && surcharges.length) {
    var filtered = surcharges.filter(function(s) {
      var nm = (s.description || s.name || s.code || '').toLowerCase();
      return nm.indexOf('residential') < 0;
    });
    if (filtered.length) {
      html += '<div class="m-sep">Surcharges</div>';
      filtered.forEach(function(s) {
        var nm = s.description || s.name || s.code || 'Surcharge';
        nm = SURCHARGE_LABELS[nm] || nm;
        html += line(nm, s.amount || s.charge || s.value || 0);
      });
    }
  }

  if (svc.cubicWeight) html += '<div class="m-line" style="color:var(--mut);font-size:.75rem"><span class="lbl">Poids volumétrique</span><span>' + fmt(svc.cubicWeight) + ' lb</span></div>';

  html += '<div class="m-total"><div class="lbl">Total estimé</div><div class="price">' + fmt(total*M) + ' $</div></div>';

  el('modal-body').innerHTML = html;
  el('modal').classList.add('show');
}

function closeModal() {
  el('modal').classList.remove('show');
}

var M=(function(){var f=localStorage.getItem('gls-factor');return 1+(f!==null?parseFloat(f):25)/100;})();
function line(label, amount, subtle) {
  var style = subtle ? ' style="font-weight:600"' : '';
  return '<div class="m-line"' + style + '><span class="lbl">' + escHtml(label) + '</span><span>' + fmt(amount*M) + ' CAD</span></div>';
}

function showError(msg) {
  el('modal-body').innerHTML = '<div style="background:var(--erb);border:1px solid var(--er);border-radius:6px;padding:1rem;color:var(--er)"><h3 style="font-size:.9rem;margin-bottom:.3rem">Erreur</h3><p style="font-size:.8rem">' + escHtml(msg) + '</p></div>';
  el('modal').classList.add('show');
}

function fmt(n) {
  if (n == null || n === '—') return '—';
  return parseFloat(n).toFixed(2);
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function clearAll() {
  el('to-postal').value = '';
  el('to-city').value = '';
  el('result').innerHTML = '';
  el('log').textContent = '';
  el('pkg-list').innerHTML = '';
  addPkg();
}

// ── INIT ──
loadConfig();
addPkg();
if (!el('to-postal').value) {
  el('to-postal').value = 'G7K 1C3';
  el('to-prov').value = 'QC';
  el('to-city').value = 'Chicoutimi';
  el('to-quick').value = 'G7K 1C3|QC|Chicoutimi';
}
