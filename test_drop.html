<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Drop</title>
<style>
body { font-family: Arial; padding: 2rem; background: #f0f0f0; }
#zone {
  width: 400px; height: 200px;
  border: 3px dashed #333;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: #333;
  background: white; cursor: pointer;
  position: relative;
}
#zone.over { background: #e0f0ff; border-color: blue; }
#log { margin-top: 1rem; font-family: monospace; font-size: .85rem; background: #111; color: #0f0; padding: 1rem; min-height: 100px; }
</style>
</head>
<body>
<h2>Test Drag & Drop depuis Outlook</h2>
<div id="zone">Glissez un fichier ici</div>
<div id="log">Événements:</div>

<script>
var zone = document.getElementById('zone');
var log  = document.getElementById('log');

function addLog(msg) {
  log.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' — ' + msg;
}

// Bloquer ouverture navigateur
document.addEventListener('dragover', function(e) { e.preventDefault(); }, true);
document.addEventListener('drop',     function(e) { e.preventDefault(); }, true);

zone.addEventListener('dragenter', function(e) {
  e.preventDefault();
  zone.classList.add('over');
  addLog('dragenter');
});
zone.addEventListener('dragover', function(e) {
  e.preventDefault();
  zone.classList.add('over');
});
zone.addEventListener('dragleave', function(e) {
  e.preventDefault();
  zone.classList.remove('over');
  addLog('dragleave');
});
zone.addEventListener('drop', function(e) {
  e.preventDefault();
  e.stopPropagation();
  zone.classList.remove('over');
  addLog('DROP reçu!');

  var files = e.dataTransfer.files;
  addLog('files.length = ' + files.length);

  if (files.length > 0) {
    var f = files[0];
    addLog('Fichier: ' + f.name + ' | type: ' + f.type + ' | size: ' + f.size);
    zone.textContent = '✅ ' + f.name;
  } else {
    // Vérifier items
    var items = e.dataTransfer.items;
    addLog('items.length = ' + (items ? items.length : 'null'));
    if (items) {
      for (var i = 0; i < items.length; i++) {
        addLog('item[' + i + ']: kind=' + items[i].kind + ' type=' + items[i].type);
      }
    }
    addLog('types: ' + Array.from(e.dataTransfer.types).join(', '));
  }
});
</script>
</body>
</html>
